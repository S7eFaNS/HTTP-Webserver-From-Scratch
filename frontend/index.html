<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🎯 Growth Tracker</h1>
            <p>Track your daily goals and stay consistent.</p>
        </header>

        <section class="panel">

            <h2>Create Goal</h2>

            <form id="goal-form">

                <input
                    id="title"
                    placeholder="Goal title"
                    required
                >

                <input
                    id="dailyTarget"
                    placeholder="Daily target"
                    required
                >

                <button type="submit">
                    Add Goal
                </button>

            </form>

        </section>

        <section class="panel">

            <h2>Find Goal By ID</h2>

            <div class="search-row">

                <input
                    id="goalId"
                    type="number"
                    placeholder="Goal ID"
                >

                <button id="findBtn">
                    Search
                </button>

            </div>

            <div id="goal-details"></div>

        </section>

        <section>

            <h2>Your Goals</h2>

            <div id="goals"></div>

        </section>

    </div>

    <script src="/app.js"></script>

</body>
</html>
